<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <!-- Primary Forge Gradient: Electric Azure -> High-Energy Blue -->
    <linearGradient id="forgeBeamGrad" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="45%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Molten Spark Gradient: Pure Amber Gold -> Hot Ember Orange -->
    <linearGradient id="forgeSparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <!-- Subtle Radial Glow Behind the Spark -->
    <radialGradient id="sparkGlow" cx="68%" cy="47%" r="35%">
      <stop offset="0%" stop-color="rgba(245, 158, 11, 0.25)"/>
      <stop offset="100%" stop-color="rgba(245, 158, 11, 0)"/>
    </radialGradient>
  </defs>

  

  <!-- Ambient Internal Hearth Glow -->
  <circle cx="58" cy="46" r="28" fill="url(#sparkGlow)"/>

  <!-- Main Forge Mark: Geometric Anvil "F" -->
  <g id="forge-monogram">
    <!-- Top Anvil Horn / Primary Bar -->
    <path d="M 23 23 
             H 74 
             C 76.5 23 78 25 77.2 27.2 
             L 73.2 36.2 
             C 72.6 37.5 71.3 38.5 69.8 38.5 
             H 39 
             V 45 
             H 59 
             C 61.2 45 62.8 46.5 62.2 48.6 
             L 59.2 56.6 
             C 58.6 57.9 57.3 58.8 55.8 58.8 
             H 39 
             V 67.5 
             L 45.5 72.5 
             C 47.2 73.8 46.8 77 44.5 77 
             H 23.5 
             C 21.2 77 20.8 73.8 22.5 72.5 
             L 29 67.5 
             V 27 
             C 29 24.8 27.2 23 23 23 Z" 
          fill="url(#forgeBeamGrad)"
          stroke="#1E3A8A"
          stroke-width="0.5"
    />

    <!-- The Molten Ember Spark (Precision Faceted Diamond) -->
    <polygon points="68,43 74,47 68,51 62,47" fill="url(#forgeSparkGrad)"/>
    <circle cx="68" cy="47" r="1.5" fill="#FFFBEB"/>
  </g>
</svg>